<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1520;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4BC4C4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38A8A8;stop-opacity:1" />
    </linearGradient>
    <!-- Subtle grid lines -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.04"/>
    </pattern>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Teal accent glow blob (top right) -->
  <ellipse cx="1050" cy="150" rx="300" ry="200" fill="#4BC4C4" fill-opacity="0.06"/>

  <!-- Bottom left accent blob -->
  <ellipse cx="150" cy="520" rx="250" ry="150" fill="#4BC4C4" fill-opacity="0.04"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#tealGrad)"/>

  <!-- Left vertical accent bar -->
  <rect x="80" y="180" width="4" height="270" fill="url(#tealGrad)" rx="2"/>

  <!-- Teal chart-like decoration (right side) -->
  <g opacity="0.15" transform="translate(820, 200)">
    <polyline points="0,200 60,160 120,180 180,100 240,120 300,60 340,80" fill="none" stroke="#4BC4C4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="0,200 60,190 120,195 180,170 240,175 300,140 340,150" fill="none" stroke="#F0F0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8,4"/>
    <!-- Dots on teal line -->
    <circle cx="180" cy="100" r="6" fill="#4BC4C4"/>
    <circle cx="300" cy="60" r="6" fill="#4BC4C4"/>
  </g>

  <!-- Logo mark — stylised "B" with teal accent -->
  <g transform="translate(112, 215)">
    <rect width="52" height="52" rx="12" fill="#4BC4C4" fill-opacity="0.15" stroke="#4BC4C4" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="26" y="37" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="30" fill="#4BC4C4" text-anchor="middle">B</text>
  </g>

  <!-- BeatMark wordmark -->
  <text
    x="184"
    y="254"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-weight="800"
    font-size="52"
    letter-spacing="-1"
    fill="#F0F0FF"
  >Beat<tspan fill="#4BC4C4">Mark</tspan></text>

  <!-- Divider -->
  <rect x="112" y="288" width="480" height="2" fill="#4BC4C4" fill-opacity="0.3" rx="1"/>

  <!-- Tagline -->
  <text
    x="112"
    y="348"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-weight="500"
    font-size="32"
    fill="#F0F0FF"
    fill-opacity="0.85"
  >Is your wealth manager</text>
  <text
    x="112"
    y="394"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-weight="500"
    font-size="32"
    fill="#F0F0FF"
    fill-opacity="0.85"
  >beating the market?</text>

  <!-- Sub-tagline -->
  <text
    x="112"
    y="452"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-weight="400"
    font-size="22"
    fill="#4BC4C4"
    fill-opacity="0.9"
  >Compare your portfolio against VWRL · Free · 60 seconds</text>

  <!-- URL badge -->
  <rect x="112" y="502" width="340" height="48" rx="8" fill="#4BC4C4" fill-opacity="0.12" stroke="#4BC4C4" stroke-width="1" stroke-opacity="0.3"/>
  <text
    x="282"
    y="532"
    font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-weight="500"
    font-size="18"
    fill="#4BC4C4"
    text-anchor="middle"
  >project-shtzw.vercel.app</text>
</svg>
