<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BeatMark — Is your portfolio beating the market? Find out in 60 seconds." />
    <title>BeatMark — Beat the Market?</title>

    <!-- Open Graph / Social sharing -->
    <meta property="og:title" content="BeatMark — Is your wealth manager beating the market?" />
    <meta property="og:description" content="Compare your investment portfolio against VWRL. Find out if your wealth manager is actually worth their fees." />
    <meta property="og:image" content="https://project-shtzw.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:url" content="https://project-shtzw.vercel.app" />
    <meta property="og:type" content="website" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BeatMark — Is your wealth manager beating the market?" />
    <meta name="twitter:description" content="Compare your investment portfolio against VWRL. Find out if your wealth manager is actually worth their fees." />
    <meta name="twitter:image" content="https://project-shtzw.vercel.app/og-image.png" />
    <!--
      og-image.png (1200×630) is a rasterised export of og-image.svg.
      PNG used because Twitter/X does not reliably render SVG og:images.
      Source SVG is at public/og-image.svg — edit the SVG, then regenerate:
        node -e "require('sharp')('./frontend/public/og-image.svg').png().toFile('./frontend/public/og-image.png', console.log)"
      Dynamic OG tags for /r/{token} shared result pages are injected server-side
      via api/r/[token].ts — the title and description update per result, the image stays static.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Plausible analytics -->
    <script defer data-domain="project-shtzw.vercel.app" src="https://plausible.io/js/script.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
